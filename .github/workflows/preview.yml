name: Preview

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --message "PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.preview.outputs.command-output }}`;
            const match = output.match(/Version Preview URL:\s*(\S+)/);
            const url = match ? match[1] : null;
            const body = url
              ? `Preview: ${url}\n\nThis is a Worker *version* preview only — it is not live production traffic. Merging this PR does not deploy it; deploy still only happens on push to \`main\` (see \`deploy.yml\`).`
              : `Preview upload ran but no preview URL was found in the wrangler output. Check the workflow log.`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
